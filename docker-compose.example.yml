services:
  antcrew-proxy:
    image: ghcr.io/iagop03/antcrew-proxy:latest
    # Or build locally: build: .
    ports:
      - "8080:8080"
    environment:
      # Required — UUID token generated by antcrew-platform
      PROXY_TOKEN: YOUR_TOKEN_FROM_ANTCREW_PLATFORM

      # Provider keys — configure only the ones you use
      ANTHROPIC_API_KEY: sk-ant-YOUR_KEY
      OPENAI_API_KEY:    sk-proj-YOUR_KEY      # optional
      GROQ_API_KEY:      gsk_YOUR_KEY          # optional
      GEMINI_API_KEY:    AIza_YOUR_KEY         # optional

      # Optional: override upstream endpoints (e.g. for local Ollama or Azure OpenAI)
      # OPENAI_BASE_URL: https://YOUR_RESOURCE.openai.azure.com/openai/deployments/YOUR_MODEL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

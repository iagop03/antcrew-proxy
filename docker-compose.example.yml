services:
  antcrew-proxy:
    image: ghcr.io/iagop03/antcrew-proxy:latest
    # Or build locally: build: .
    ports:
      - "8080:8080"
    environment:
      ANTHROPIC_API_KEY: sk-ant-YOUR_REAL_KEY_HERE
      PROXY_TOKEN: YOUR_TOKEN_FROM_ANTCREW_PLATFORM
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
